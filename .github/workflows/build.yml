                  wrapper.setDescendantFocusability(LinearLayout.FOCUS_BLOCK_DESCENDANTS);

                  LinearLayout.LayoutParams wrapLp = new LinearLayout.LayoutParams(170, LinearLayout.LayoutParams.WRAP_CONTENT);
