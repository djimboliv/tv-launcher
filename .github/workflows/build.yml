name: Build Philips Glass UI v9

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Сборка APK v9 с защитой от множественного удаления
        run: |
          mkdir -p src/com/custom/philipslauncher res/xml build/classes

          cat << 'EOF' > res/xml/key_service.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagIncludeNotImportantViews"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="20" />
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.custom.philipslauncher"
              android:versionCode="9"
              android:versionName="9.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="29" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="Philips Glass Home"
                  android:debuggable="true"
                  android:hardwareAccelerated="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTask"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter priority="999">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeyInterceptService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/key_service" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/custom/philipslauncher/KeyInterceptService.java
          package com.custom.philipslauncher;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.Toast;
          import java.util.List;

          public class KeyInterceptService extends AccessibilityService {
              public static volatile int learnMode = 0;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Если старый лаунчер всё же попытался всплыть — мгновенно перекрываем его нашим
                  if (event != null && event.getPackageName() != null) {
                      String pkg = event.getPackageName().toString();
                      if (pkg.equals("com.google.android.tvlauncher") || pkg.equals("org.droidtv.tvlauncher")) {
                          Intent home = new Intent(this, MainActivity.class);
                          home.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(home);
                      }
                  }
              }

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int scan = event.getScanCode();

                  if (learnMode > 0 && event.getAction() == KeyEvent.ACTION_DOWN) {
                      if (code == KeyEvent.KEYCODE_DPAD_UP || code == KeyEvent.KEYCODE_DPAD_DOWN ||
                          code == KeyEvent.KEYCODE_DPAD_LEFT || code == KeyEvent.KEYCODE_DPAD_RIGHT ||
                          code == KeyEvent.KEYCODE_DPAD_CENTER || code == KeyEvent.KEYCODE_ENTER ||
                          code == KeyEvent.KEYCODE_BACK) {
                          return super.onKeyEvent(event);
                      }
                      SharedPreferences prefs = getSharedPreferences("launcher_prefs", MODE_PRIVATE);
                      if (learnMode == 1) {
                          prefs.edit().putInt("vpn_keycode", code).putInt("vpn_scancode", scan).apply();
                          Toast.makeText(this, "Кнопка (код " + code + "/" + scan + ") привязана к v2rayTun!", Toast.LENGTH_LONG).show();
                      } else if (learnMode == 2) {
                          prefs.edit().putInt("zona_keycode", code).putInt("zona_scancode", scan).apply();
                          Toast.makeText(this, "Кнопка (код " + code + "/" + scan + ") привязана к Zona!", Toast.LENGTH_LONG).show();
                      }
                      learnMode = 0;
                      return true;
                  }

                  if (code == KeyEvent.KEYCODE_HOME) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          Intent home = new Intent(this, MainActivity.class);
                          home.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                          startActivity(home);
                      }
                      return true;
                  }

                  SharedPreferences prefs = getSharedPreferences("launcher_prefs", MODE_PRIVATE);
                  int savedVpnCode = prefs.getInt("vpn_keycode", -1);
                  int savedVpnScan = prefs.getInt("vpn_scancode", -1);
                  int savedZonaCode = prefs.getInt("zona_keycode", -1);
                  int savedZonaScan = prefs.getInt("zona_scancode", -1);

                  boolean isVpnKey = (savedVpnCode > 0 && code == savedVpnCode) ||
                                     (savedVpnScan > 0 && scan == savedVpnScan) ||
                                     code == KeyEvent.KEYCODE_BUTTON_1 || code == KeyEvent.KEYCODE_BUTTON_8 ||
                                     code == 188 || code == 191 || code == 195 ||
                                     scan == 380 || scan == 412 || scan == 217 || scan == 139 || scan == 402;

                  boolean isZonaKey = (savedZonaCode > 0 && code == savedZonaCode) ||
                                      (savedZonaScan > 0 && scan == savedZonaScan) ||
                                      code == KeyEvent.KEYCODE_BUTTON_2 || code == KeyEvent.KEYCODE_BUTTON_3 ||
                                      code == KeyEvent.KEYCODE_BUTTON_4 || code == 189 || code == 190 ||
                                      scan == 381 || scan == 413;

                  if (isVpnKey) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                          launchByKeyword("v2ray");
                      }
                      return true;
                  }

                  if (isZonaKey) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                          launchByKeyword("zona");
                      }
                      return true;
                  }

                  return super.onKeyEvent(event);
              }

              private void launchByKeyword(String keyword) {
                  try {
                      PackageManager pm = getPackageManager();
                      Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                      List<ResolveInfo> list = pm.queryIntentActivities(mainIntent, 0);
                      for (ResolveInfo info : list) {
                          String pkg = info.activityInfo.packageName;
                          String label = info.loadLabel(pm).toString();
                          if (pkg.toLowerCase().contains(keyword) || label.toLowerCase().contains(keyword)) {
                              Intent launch = pm.getLeanbackLaunchIntentForPackage(pkg);
                              if (launch == null) launch = pm.getLaunchIntentForPackage(pkg);
                              if (launch == null) {
                                  launch = new Intent(Intent.ACTION_MAIN);
                                  launch.setComponent(new ComponentName(pkg, info.activityInfo.name));
                              }
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                              startActivity(launch);
                              return;
                          }
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat << 'EOF' > src/com/custom/philipslauncher/MainActivity.java
          package com.custom.philipslauncher;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.GridLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private PackageManager pm;
              private SharedPreferences prefs;
              private List<AppEntry> allApps = new ArrayList<AppEntry>();
              private AppEntry v2rayApp = null;
              private AppEntry zonaApp = null;
              private LinearLayout appsStrip;
              private FrameLayout allAppsOverlay;
              private GridLayout allAppsGrid;
              private TextView topTimeView, topDateView;
              private ImageView bgWallpaper;
              private long lastLongPressTime = 0;

              private static class AppEntry {
                  String label;
                  String pkg;
                  String activityName;
                  Drawable icon;
                  Drawable banner;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  pm = getPackageManager();
                  prefs = getSharedPreferences("launcher_prefs", MODE_PRIVATE);
                  buildUi();
                  loadCustomWallpaper();
                  scanInstalledApps();
                  renderFavoritesStrip();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateClock();
                  loadCustomWallpaper();
                  scanInstalledApps();
                  renderFavoritesStrip();
              }

              @Override
              public void onBackPressed() {
                  if (allAppsOverlay != null && allAppsOverlay.getVisibility() == View.VISIBLE) {
                      allAppsOverlay.setVisibility(View.GONE);
                      if (appsStrip.getChildCount() > 0) {
                          appsStrip.getChildAt(0).requestFocus();
                      }
                  }
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int scan = event.getScanCode();

                  if (KeyInterceptService.learnMode > 0 && event.getAction() == KeyEvent.ACTION_DOWN) {
                      if (code != KeyEvent.KEYCODE_DPAD_UP && code != KeyEvent.KEYCODE_DPAD_DOWN &&
                          code != KeyEvent.KEYCODE_DPAD_LEFT && code != KeyEvent.KEYCODE_DPAD_RIGHT &&
                          code != KeyEvent.KEYCODE_DPAD_CENTER && code != KeyEvent.KEYCODE_ENTER &&
                          code != KeyEvent.KEYCODE_BACK) {
                          if (KeyInterceptService.learnMode == 1) {
                              prefs.edit().putInt("vpn_keycode", code).putInt("vpn_scancode", scan).apply();
                              Toast.makeText(this, "Готово! Кнопка (код " + code + "/" + scan + ") привязана к v2rayTun!", Toast.LENGTH_LONG).show();
                          } else {
                              prefs.edit().putInt("zona_keycode", code).putInt("zona_scancode", scan).apply();
                              Toast.makeText(this, "Готово! Кнопка (код " + code + "/" + scan + ") привязана к Zona!", Toast.LENGTH_LONG).show();
                          }
                          KeyInterceptService.learnMode = 0;
                          return true;
                      }
                  }

                  int savedVpnCode = prefs.getInt("vpn_keycode", -1);
                  int savedVpnScan = prefs.getInt("vpn_scancode", -1);
                  int savedZonaCode = prefs.getInt("zona_keycode", -1);
                  int savedZonaScan = prefs.getInt("zona_scancode", -1);

                  if ((savedVpnCode > 0 && code == savedVpnCode) || (savedVpnScan > 0 && scan == savedVpnScan) ||
                      code == KeyEvent.KEYCODE_BUTTON_1 || code == 188 || code == 191 || scan == 380 || scan == 412 || scan == 217) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                          launchEntry(v2rayApp, "v2rayTun");
                      }
                      return true;
                  }

                  if ((savedZonaCode > 0 && code == savedZonaCode) || (savedZonaScan > 0 && scan == savedZonaScan) ||
                      code == KeyEvent.KEYCODE_BUTTON_2 || code == KeyEvent.KEYCODE_BUTTON_3 || code == 189 || code == 190 || scan == 381 || scan == 413) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                          launchEntry(zonaApp, "Zona");
                      }
                      return true;
                  }

                  return super.dispatchKeyEvent(event);
              }

              private void loadCustomWallpaper() {
                  try {
                      File internalFile = new File(getFilesDir(), "wallpaper.jpg");
                      File extFile = new File(getExternalFilesDir(null), "wallpaper.jpg");
                      String[] paths = new String[] {
                          internalFile.getAbsolutePath(),
                          extFile.getAbsolutePath(),
                          "/data/local/tmp/wallpaper.jpg",
                          "/sdcard/wallpaper.jpg"
                      };
                      for (String path : paths) {
                          File f = new File(path);
                          if (f.exists() && f.length() > 100) {
                              Bitmap bmp = BitmapFactory.decodeFile(f.getAbsolutePath());
                              if (bmp != null) {
                                  bgWallpaper.setImageBitmap(bmp);
                                  return;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void buildUi() {
                  FrameLayout screen = new FrameLayout(this);
                  screen.setBackgroundColor(Color.parseColor("#12161F"));

                  bgWallpaper = new ImageView(this);
                  bgWallpaper.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  screen.addView(bgWallpaper, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  View topBottomShade = new View(this);
                  GradientDrawable vignette = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.parseColor("#55000000"), Color.TRANSPARENT, Color.TRANSPARENT, Color.parseColor("#88000000")});
                  topBottomShade.setBackground(vignette);
                  screen.addView(topBottomShade, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(52, 32, 52, 28);
                  root.setClipChildren(false);
                  root.setClipToPadding(false);

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  topBar.addView(createTopPill("❖  Все приложения", new View.OnClickListener() {
                      @Override public void onClick(View v) { showAllAppsDrawer(); }
                  }));
                  topBar.addView(createTopPill("🎯  Привязать кнопку пульта", new View.OnClickListener() {
                      @Override public void onClick(View v) { showLearnKeyDialog(); }
                  }));
                  topBar.addView(createTopPill("⚙  Настройки ТВ", new View.OnClickListener() {
                      @Override public void onClick(View v) { startActivity(new Intent(Settings.ACTION_SETTINGS)); }
                  }));
                  topBar.addView(createTopPill("🌐  Wi-Fi", new View.OnClickListener() {
                      @Override public void onClick(View v) { startActivity(new Intent(Settings.ACTION_WIFI_SETTINGS)); }
                  }));

                  View hSpacer = new View(this);
                  topBar.addView(hSpacer, new LinearLayout.LayoutParams(0, 1, 1f));

                  LinearLayout clockPill = new LinearLayout(this);
                  clockPill.setOrientation(LinearLayout.HORIZONTAL);
                  clockPill.setGravity(Gravity.CENTER_VERTICAL);
                  clockPill.setPadding(24, 8, 24, 8);
                  GradientDrawable clockBg = new GradientDrawable();
                  clockBg.setColor(Color.parseColor("#550F172A"));
                  clockBg.setCornerRadius(30f);
                  clockBg.setStroke(2, Color.parseColor("#55FFFFFF"));
                  clockPill.setBackground(clockBg);

                  topTimeView = new TextView(this);
                  topTimeView.setTextColor(Color.WHITE);
                  topTimeView.setTextSize(19);
                  topTimeView.setTypeface(Typeface.DEFAULT_BOLD);
                  clockPill.addView(topTimeView);

                  topDateView = new TextView(this);
                  topDateView.setTextColor(Color.parseColor("#E2E8F0"));
                  topDateView.setTextSize(13);
                  topDateView.setPadding(12, 0, 0, 0);
                  clockPill.addView(topDateView);

                  topBar.addView(clockPill);
                  root.addView(topBar);

                  View photoWindow = new View(this);
                  photoWindow.setFocusable(false);
                  root.addView(photoWindow, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  TextView hintView = new TextView(this);
                  hintView.setText("Избранное  •  Удерживайте OK на карточке для меню удаления");
                  hintView.setTextColor(Color.parseColor("#CCFFFFFF"));
                  hintView.setShadowLayer(4f, 0f, 2f, Color.BLACK);
                  hintView.setTextSize(12);
                  hintView.setPadding(14, 0, 0, 4);
                  root.addView(hintView);

                  HorizontalScrollView appScroll = new HorizontalScrollView(this);
                  appScroll.setHorizontalScrollBarEnabled(false);
                  appScroll.setFocusable(false);
                  appScroll.setClipChildren(false);
                  appScroll.setClipToPadding(false);

                  appsStrip = new LinearLayout(this);
                  appsStrip.setOrientation(LinearLayout.HORIZONTAL);
                  appsStrip.setPadding(14, 14, 14, 12);
                  appsStrip.setClipChildren(false);
                  appsStrip.setClipToPadding(false);
                  appScroll.addView(appsStrip);

                  root.addView(appScroll);
                  screen.addView(root, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  allAppsOverlay = new FrameLayout(this);
                  allAppsOverlay.setBackgroundColor(Color.parseColor("#DD0B0F19"));
                  allAppsOverlay.setVisibility(View.GONE);

                  LinearLayout drawerBox = new LinearLayout(this);
                  drawerBox.setOrientation(LinearLayout.VERTICAL);
                  drawerBox.setPadding(64, 48, 64, 48);

                  TextView drawerTitle = new TextView(this);
                  drawerTitle.setText("Все приложения (Нажмите OK для запуска • Нажмите Назад для выхода)");
                  drawerTitle.setTextColor(Color.WHITE);
                  drawerTitle.setTextSize(20);
                  drawerTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  drawerTitle.setPadding(10, 0, 0, 24);
                  drawerBox.addView(drawerTitle);

                  ScrollView gridScroll = new ScrollView(this);
                  gridScroll.setFillViewport(true);
                  allAppsGrid = new GridLayout(this);
                  allAppsGrid.setColumnCount(4);
                  allAppsGrid.setClipChildren(false);
                  allAppsGrid.setClipToPadding(false);
                  gridScroll.addView(allAppsGrid);
                  drawerBox.addView(gridScroll);

                  allAppsOverlay.addView(drawerBox);
                  screen.addView(allAppsOverlay, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  setContentView(screen);
              }

              private void updateClock() {
                  Date now = new Date();
                  topTimeView.setText(new SimpleDateFormat("HH:mm", Locale.getDefault()).format(now));
                  topDateView.setText(new SimpleDateFormat("EEE, d MMM", Locale.getDefault()).format(now));
              }

              private void scanInstalledApps() {
                  allApps.clear();
                  v2rayApp = null;
                  zonaApp = null;

                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  List<ResolveInfo> resolved = pm.queryIntentActivities(mainIntent, 0);
                  Set<String> seenPackages = new HashSet<String>();

                  for (ResolveInfo info : resolved) {
                      if (info.activityInfo == null) continue;
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(getPackageName()) || seenPackages.contains(pkg)) continue;

                      Intent lb = pm.getLeanbackLaunchIntentForPackage(pkg);
                      Intent std = pm.getLaunchIntentForPackage(pkg);
                      if (lb == null && std == null) continue;

                      seenPackages.add(pkg);

                      AppEntry entry = new AppEntry();
                      entry.pkg = pkg;
                      entry.activityName = info.activityInfo.name;
                      entry.label = info.loadLabel(pm).toString();
                      entry.icon = info.loadIcon(pm);
                      entry.banner = info.activityInfo.loadBanner(pm);
                      if (entry.banner == null) {
                          entry.banner = info.activityInfo.applicationInfo.loadBanner(pm);
                      }

                      String lp = pkg.toLowerCase();
                      String ll = entry.label.toLowerCase();
                      if (lp.contains("v2ray") || ll.contains("v2ray")) {
                          v2rayApp = entry;
                      } else if (lp.contains("zona") || ll.equals("zona")) {
                          zonaApp = entry;
                      }
                      allApps.add(entry);
                  }

                  Collections.sort(allApps, new Comparator<AppEntry>() {
                      @Override
                      public int compare(AppEntry a, AppEntry b) {
                          return a.label.compareToIgnoreCase(b.label);
                      }
                  });
              }

              private List<String> getSavedFavorites() {
                  String raw = prefs.getString("fav_pkgs_v8", null);
                  List<String> favs = new ArrayList<String>();
                  if (raw == null) {
                      if (v2rayApp != null) favs.add(v2rayApp.pkg);
                      if (zonaApp != null) favs.add(zonaApp.pkg);
                      saveFavorites(favs);
                  } else if (!raw.isEmpty()) {
                      favs.addAll(Arrays.asList(raw.split(",")));
                  }
                  return favs;
              }

              private void saveFavorites(List<String> favs) {
                  Set<String> unique = new LinkedHashSet<String>(favs);
                  prefs.edit().putString("fav_pkgs_v8", TextUtils.join(",", unique)).apply();
              }

              // БЕЗОПАСНОЕ МЕНЮ УДАЛЕНИЯ ОДНОГО ПРИЛОЖЕНИЯ (Защита от цепного удаления!)
              private void confirmRemoveSingleApp(final AppEntry app) {
                  long now = SystemClock.uptimeMillis();
                  if (now - lastLongPressTime < 1200) return; // Блокировка повторного вызова
                  lastLongPressTime = now;

                  String[] actions = new String[] {
                      "❌ Убрать «" + app.label + "» с главного экрана",
                      "⚙ Открыть системные настройки приложения (Очистить кэш)",
                      "Отмена"
                  };

                  AlertDialog.Builder builder = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                  builder.setTitle(app.label);
                  builder.setItems(actions, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface dialog, int which) {
                          if (which == 0) {
                              List<String> favPkgs = getSavedFavorites();
                              favPkgs.remove(app.pkg);
                              saveFavorites(favPkgs);
                              renderFavoritesStrip();
                              Toast.makeText(MainActivity.this, app.label + " убрано из избранного", Toast.LENGTH_SHORT).show();
                          } else if (which == 1) {
                              Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                              intent.setData(Uri.parse("package:" + app.pkg));
                              startActivity(intent);
                          }
                      }
                  });
                  builder.show();
              }

              private void renderFavoritesStrip() {
                  appsStrip.removeAllViews();
                  final List<String> favPkgs = getSavedFavorites();

                  View firstFocus = null;
                  for (final String pkg : favPkgs) {
                      AppEntry found = null;
                      for (AppEntry e : allApps) {
                          if (e.pkg.equals(pkg)) {
                              found = e;
                              break;
                          }
                      }
                      if (found == null) continue;
                      final AppEntry app = found;

                      View card = createGlassAppCard(
                          app.label, app.icon != null ? app.icon : app.banner, false,
                          new View.OnClickListener() {
                              @Override public void onClick(View v) { launchEntry(app, app.label); }
                          },
                          new View.OnLongClickListener() {
                              @Override public boolean onLongClick(View v) {
                                  confirmRemoveSingleApp(app);
                                  return true;
                              }
                          }
                      );
                      appsStrip.addView(card);
                      if (firstFocus == null) firstFocus = card;
                  }

                  View addPlusCard = createActionCard("＋", "Добавить", "#4410B981", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showAddAppDialog();
                      }
                  });
                  appsStrip.addView(addPlusCard);
                  if (firstFocus == null) firstFocus = addPlusCard;

                  View allAppsCard = createActionCard("❖", "Все приложения", "#443B82F6", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showAllAppsDrawer();
                      }
                  });
                  appsStrip.addView(allAppsCard);

                  if (firstFocus != null && (allAppsOverlay == null || allAppsOverlay.getVisibility() != View.VISIBLE)) {
                      firstFocus.requestFocus();
                  }
              }

              private void showAddAppDialog() {
                  final List<String> favPkgs = getSavedFavorites();
                  final String[] names = new String[allApps.size()];
                  final boolean[] checked = new boolean[allApps.size()];

                  for (int i = 0; i < allApps.size(); i++) {
                      names[i] = allApps.get(i).label;
                      checked[i] = favPkgs.contains(allApps.get(i).pkg);
                  }

                  AlertDialog.Builder builder = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                  builder.setTitle("Выберите приложения для главного экрана:");
                  builder.setMultiChoiceItems(names, checked, new DialogInterface.OnMultiChoiceClickListener() {
                      @Override
                      public void onClick(DialogInterface dialog, int which, boolean isChecked) {
                          String pkg = allApps.get(which).pkg;
                          if (isChecked) {
                              if (!favPkgs.contains(pkg)) favPkgs.add(pkg);
                          } else {
                              favPkgs.remove(pkg);
                          }
                      }
                  });
                  builder.setPositiveButton("Сохранить", new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface dialog, int which) {
                          saveFavorites(favPkgs);
                          renderFavoritesStrip();
                      }
                  });
                  builder.show();
              }

              private void showAllAppsDrawer() {
                  allAppsGrid.removeAllViews();
                  View first = null;
                  for (final AppEntry app : allApps) {
                      View card = createGlassAppCard(
                          app.label, app.icon != null ? app.icon : app.banner, true,
                          new View.OnClickListener() {
                              @Override public void onClick(View v) {
                                  allAppsOverlay.setVisibility(View.GONE);
                                  launchEntry(app, app.label);
                              }
                          },
                          null
                      );
                      allAppsGrid.addView(card);
                      if (first == null) first = card;
                  }
                  allAppsOverlay.setVisibility(View.VISIBLE);
                  if (first != null) first.requestFocus();
              }

              private void showLearnKeyDialog() {
                  String[] options = new String[] {
                      "1. Назначить кнопку пульта для запуска v2rayTun",
                      "2. Назначить кнопку пульта для запуска Zona"
                  };
                  AlertDialog.Builder b = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                  b.setTitle("Привязка кнопки пульта");
                  b.setItems(options, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface d, int which) {
                          KeyInterceptService.learnMode = (which == 0) ? 1 : 2;
                          Toast.makeText(MainActivity.this, "ТЕПЕРЬ НАЖМИТЕ ЖЕЛАЕМУЮ КНОПКУ НА ПУЛЬТЕ (например, Netflix)!", Toast.LENGTH_LONG).show();
                      }
                  });
                  b.show();
              }

              private View createGlassAppCard(String title, Drawable icon, boolean isGrid, final View.OnClickListener onClick, final View.OnLongClickListener onLongClick) {
                  LinearLayout wrapper = new LinearLayout(this);
                  wrapper.setOrientation(LinearLayout.VERTICAL);
                  wrapper.setGravity(Gravity.CENTER_HORIZONTAL);
                  wrapper.setFocusable(true);
                  wrapper.setClickable(true);
                  wrapper.setDescendantFocusability(LinearLayout.FOCUS_BLOCK_DESCENDANTS);

                  if (isGrid) {
                      GridLayout.LayoutParams glp = new GridLayout.LayoutParams();
                      glp.width = 240;
                      glp.height = GridLayout.LayoutParams.WRAP_CONTENT;
                      glp.setMargins(14, 14, 14, 14);
                      wrapper.setLayoutParams(glp);
                  } else {
                      LinearLayout.LayoutParams wrapLp = new LinearLayout.LayoutParams(226, LinearLayout.LayoutParams.WRAP_CONTENT);
                      wrapLp.setMargins(10, 0, 10, 0);
                      wrapper.setLayoutParams(wrapLp);
                  }

                  final FrameLayout cardBox = new FrameLayout(this);
                  LinearLayout.LayoutParams boxLp = new LinearLayout.LayoutParams(214, 114);
                  cardBox.setLayoutParams(boxLp);

                  final GradientDrawable normalBoxBg = new GradientDrawable();
                  normalBoxBg.setColor(Color.parseColor("#3D0F172A"));
                  normalBoxBg.setCornerRadius(16f);
                  normalBoxBg.setStroke(2, Color.parseColor("#55FFFFFF"));

                  final GradientDrawable focusedBoxBg = new GradientDrawable();
                  focusedBoxBg.setColor(Color.parseColor("#771E293B"));
                  focusedBoxBg.setCornerRadius(16f);
                  focusedBoxBg.setStroke(5, Color.parseColor("#FFD600"));

                  cardBox.setBackground(normalBoxBg);

                  LinearLayout inner = new LinearLayout(this);
                  inner.setOrientation(LinearLayout.HORIZONTAL);
                  inner.setGravity(Gravity.CENTER);
                  inner.setPadding(16, 12, 16, 12);

                  ImageView iconImg = new ImageView(this);
                  iconImg.setImageDrawable(icon);
                  iconImg.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  inner.addView(iconImg, new LinearLayout.LayoutParams(56, 56));

                  TextView innerTitle = new TextView(this);
                  innerTitle.setText(title);
                  innerTitle.setTextColor(Color.WHITE);
                  innerTitle.setShadowLayer(4f, 0f, 2f, Color.BLACK);
                  innerTitle.setTextSize(14);
                  innerTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  innerTitle.setMaxLines(2);
                  innerTitle.setEllipsize(TextUtils.TruncateAt.END);
                  innerTitle.setPadding(12, 0, 0, 0);
                  inner.addView(innerTitle, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  cardBox.addView(inner, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  final TextView bottomCaption = new TextView(this);
                  bottomCaption.setText(title);
                  bottomCaption.setTextColor(Color.WHITE);
                  bottomCaption.setShadowLayer(6f, 0f, 2f, Color.BLACK);
                  bottomCaption.setTextSize(12);
                  bottomCaption.setSingleLine(true);
                  bottomCaption.setEllipsize(TextUtils.TruncateAt.END);
                  bottomCaption.setGravity(Gravity.CENTER);
                  bottomCaption.setPadding(4, 6, 4, 2);

                  wrapper.addView(cardBox);
                  wrapper.addView(bottomCaption);

                  wrapper.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          cardBox.setBackground(hasFocus ? focusedBoxBg : normalBoxBg);
                          bottomCaption.setTextColor(hasFocus ? Color.parseColor("#FFD600") : Color.WHITE);
                          bottomCaption.setTypeface(hasFocus ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                          v.animate().scaleX(hasFocus ? 1.09f : 1.0f).scaleY(hasFocus ? 1.09f : 1.0f).setDuration(120).start();
                      }
                  });

                  wrapper.setOnClickListener(onClick);
                  if (onLongClick != null) wrapper.setOnLongClickListener(onLongClick);

                  wrapper.setOnKeyListener(new View.OnKeyListener() {
                      private boolean longTriggered = false;

                      @Override
                      public boolean onKey(View v, int keyCode, KeyEvent event) {
                          if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER || keyCode == KeyEvent.KEYCODE_NUMPAD_ENTER) {
                              if (event.getAction() == KeyEvent.ACTION_DOWN) {
                                  if (event.getRepeatCount() == 0) {
                                      longTriggered = false;
                                  } else if (event.getRepeatCount() == 1 && !longTriggered && onLongClick != null) {
                                      // Срабатывает СТРОГО ОДИН РАЗ при удержании!
                                      longTriggered = true;
                                      return onLongClick.onLongClick(v);
                                  }
                                  return true;
                              }
                              if (event.getAction() == KeyEvent.ACTION_UP) {
                                  if (!longTriggered) {
                                      onClick.onClick(v);
                                  }
                                  longTriggered = false;
                                  return true;
                              }
                          }
                          return false;
                      }
                  });

                  return wrapper;
              }

              private View createActionCard(String bigSymbol, String label, String tintHex, final View.OnClickListener onClick) {
                  LinearLayout wrapper = new LinearLayout(this);
                  wrapper.setOrientation(LinearLayout.VERTICAL);
                  wrapper.setGravity(Gravity.CENTER_HORIZONTAL);
                  wrapper.setFocusable(true);
