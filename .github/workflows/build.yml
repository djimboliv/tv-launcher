name: Build Philips Glass UI v11

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Сборка APK v11 (без лагов в YouTube и с универсальной привязкой)
        run: |
          mkdir -p src/com/custom/philipslauncher res/xml build/classes

          cat << 'EOF' > res/xml/key_service.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.custom.philipslauncher"
              android:versionCode="11"
              android:versionName="11.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="29" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="Philips Glass Home"
                  android:debuggable="true"
                  android:hardwareAccelerated="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTask"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter priority="999">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeyInterceptService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/key_service" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/custom/philipslauncher/KeyInterceptService.java
          package com.custom.philipslauncher;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;

          public class KeyInterceptService extends AccessibilityService {
              public static volatile boolean waitingForKey = false;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  // Обрабатываем ТОЛЬКО смену активного окна — ноль нагрузки при наборе текста в YouTube
                  if (event == null || event.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  CharSequence pkgCs = event.getPackageName();
                  if (pkgCs == null) return;
                  String pkg = pkgCs.toString();
                  if (pkg.equals(getPackageName())) return;

                  if (waitingForKey && (pkg.equals("ru.ivi.client") || pkg.contains("netflix") || pkg.contains("rakuten") || pkg.contains("amazon") || pkg.contains("okko"))) {
                      waitingForKey = false;
                      Intent pick = new Intent(this, MainActivity.class);
                      pick.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      pick.putExtra("bind_key_id", "pkg:" + pkg);
                      pick.putExtra("bind_key_label", "Кнопка " + pkg);
                      startActivity(pick);
                      return;
                  }

                  if (pkg.equals("com.google.android.tvlauncher") || pkg.equals("org.droidtv.tvlauncher")) {
                      Intent home = new Intent(this, MainActivity.class);
                      home.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      startActivity(home);
                      return;
                  }

                  SharedPreferences prefs = getSharedPreferences("launcher_prefs", MODE_PRIVATE);
                  String redirectedPkg = prefs.getString("bind_pkg:" + pkg, null);
                  if (redirectedPkg != null && !redirectedPkg.isEmpty() && !redirectedPkg.equals(pkg)) {
                      launchPackage(redirectedPkg);
                  }
              }

              @Override
              public void onInterrupt() {}

              public static boolean isSystemNavKey(int code) {
                  return code == KeyEvent.KEYCODE_DPAD_UP ||
                         code == KeyEvent.KEYCODE_DPAD_DOWN ||
                         code == KeyEvent.KEYCODE_DPAD_LEFT ||
                         code == KeyEvent.KEYCODE_DPAD_RIGHT ||
                         code == KeyEvent.KEYCODE_DPAD_CENTER ||
                         code == KeyEvent.KEYCODE_ENTER ||
                         code == KeyEvent.KEYCODE_NUMPAD_ENTER ||
                         code == KeyEvent.KEYCODE_BACK ||
                         code == KeyEvent.KEYCODE_HOME ||
                         code == KeyEvent.KEYCODE_VOLUME_UP ||
                         code == KeyEvent.KEYCODE_VOLUME_DOWN ||
                         code == KeyEvent.KEYCODE_VOLUME_MUTE ||
                         code == KeyEvent.KEYCODE_POWER;
              }

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int scan = event.getScanCode();

                  if (waitingForKey) {
                      if (code == KeyEvent.KEYCODE_BACK) {
                          if (event.getAction() == KeyEvent.ACTION_UP) {
                              waitingForKey = false;
                          }
                          return super.onKeyEvent(event);
                      }
                      if (isSystemNavKey(code) || (code == 0 && scan == 0)) {
                          return super.onKeyEvent(event);
                      }
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          waitingForKey = false;
                          String keyId = code + ":" + scan;
                          Intent pick = new Intent(this, MainActivity.class);
                          pick.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          pick.putExtra("bind_key_id", keyId);
                          pick.putExtra("bind_key_label", "Код " + code + " / Скан " + scan);
                          startActivity(pick);
                      }
                      return true;
                  }

                  if (code == KeyEvent.KEYCODE_HOME) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          Intent home = new Intent(this, MainActivity.class);
                          home.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                          startActivity(home);
                      }
                      return true;
                  }

                  if (code != 0 || scan != 0) {
                      SharedPreferences prefs = getSharedPreferences("launcher_prefs", MODE_PRIVATE);
                      String keyId = code + ":" + scan;
                      String targetPkg = prefs.getString("bind_" + keyId, null);
                      if (targetPkg != null && !targetPkg.isEmpty()) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                              launchPackage(targetPkg);
                          }
                          return true;
                      }
                  }

                  return super.onKeyEvent(event);
              }

              private void launchPackage(String pkg) {
                  try {
                      PackageManager pm = getPackageManager();
                      Intent launch = pm.getLeanbackLaunchIntentForPackage(pkg);
                      if (launch == null) launch = pm.getLaunchIntentForPackage(pkg);
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                          startActivity(launch);
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

