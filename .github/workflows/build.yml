name: Build Philips Lite Launcher

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Генерация исходников и сборка APK
        run: |
          mkdir -p src/com/custom/philipslauncher build/classes

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.custom.philipslauncher"
              android:versionCode="2"
              android:versionName="1.1">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="30" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="Philips Lite Home"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/custom/philipslauncher/MainActivity.java
          package com.custom.philipslauncher;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.GridLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.List;

          public class MainActivity extends Activity {
              private PackageManager pm;
              private String v2rayPkg = null;
              private String zonaPkg = null;
              private GridLayout appsGrid;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  pm = getPackageManager();
                  buildUi();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  loadInstalledApps();
              }

              @Override
              public void onBackPressed() {
                  // Блокируем закрытие главного экрана по кнопке Назад
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  // Кнопка Netflix на пультах Philips (KEYCODE_BUTTON_1 = 188) -> запуск v2rayTun
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_1 || keyCode == 188) {
                      launchSpecialApp(v2rayPkg, "v2rayTun");
                      return true;
                  }
                  // Соседняя рекламная кнопка Prime Video / Rakuten / Кинопоиск (189 или 190) -> запуск Zona
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_2 || keyCode == KeyEvent.KEYCODE_BUTTON_3 || keyCode == 189 || keyCode == 190) {
                      launchSpecialApp(zonaPkg, "Zona");
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#0D1117"));
                  scroll.setFillViewport(true);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(64, 48, 64, 48);

                  TextView title = new TextView(this);
                  title.setText("PHILIPS TV • БЫСТРЫЙ ДОСТУП (Кнопка Netflix = VPN)");
                  title.setTextColor(Color.parseColor("#8B949E"));
                  title.setTextSize(16);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  LinearLayout heroRow = new LinearLayout(this);
                  heroRow.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams heroParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  heroParams.setMargins(0, 24, 0, 48);
                  heroRow.setLayoutParams(heroParams);

                  TextView vpnBtn = createButton("VPN: v2rayTun", "#1F6FEB", "#00E676", true);
                  vpnBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { launchSpecialApp(v2rayPkg, "v2rayTun"); }
                  });
                  vpnBtn.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) { return openAppInfo(v2rayPkg); }
                  });

                  TextView zonaBtn = createButton("ZONA (Кино)", "#238636", "#00E676", true);
                  zonaBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { launchSpecialApp(zonaPkg, "Zona"); }
                  });
                  zonaBtn.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) { return openAppInfo(zonaPkg); }
                  });

                  TextView settingsBtn = createButton("Настройки ТВ", "#21262D", "#58A6FF", true);
                  settingsBtn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { startActivity(new Intent(Settings.ACTION_SETTINGS)); }
                  });

                  heroRow.addView(vpnBtn);
                  heroRow.addView(zonaBtn);
                  heroRow.addView(settingsBtn);
                  root.addView(heroRow);

                  TextView gridTitle = new TextView(this);
                  gridTitle.setText("ВСЕ ПРИЛОЖЕНИЯ (Удерживайте OK для очистки кэша или остановки)");
                  gridTitle.setTextColor(Color.parseColor("#8B949E"));
                  gridTitle.setTextSize(13);
                  root.addView(gridTitle);

                  appsGrid = new GridLayout(this);
                  appsGrid.setColumnCount(4);
                  LinearLayout.LayoutParams gridParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  gridParams.setMargins(0, 20, 0, 0);
                  appsGrid.setLayoutParams(gridParams);
                  root.addView(appsGrid);

                  scroll.addView(root);
                  setContentView(scroll);
                  vpnBtn.requestFocus();
              }

              private void loadInstalledApps() {
                  appsGrid.removeAllViews();
                  v2rayPkg = null;
                  zonaPkg = null;

                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  List<ResolveInfo> list = pm.queryIntentActivities(mainIntent, 0);

                  for (ResolveInfo info : list) {
                      final String pkg = info.activityInfo.packageName;
                      if (pkg.equals(getPackageName())) continue;

                      String label = info.loadLabel(pm).toString();
                      String lowerPkg = pkg.toLowerCase();
                      String lowerLabel = label.toLowerCase();

                      if (lowerPkg.contains("v2ray") || lowerLabel.contains("v2ray")) {
                          v2rayPkg = pkg;
                          continue;
                      }
                      if (lowerPkg.contains("zona") || lowerLabel.equals("zona")) {
                          zonaPkg = pkg;
                          continue;
                      }
                      if (pm.getLaunchIntentForPackage(pkg) == null && pm.getLeanbackLaunchIntentForPackage(pkg) == null) {
                          continue;
                      }

                      TextView item = createButton(label, "#161B22", "#58A6FF", false);
                      item.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View v) { launchPackage(pkg); }
                      });
                      item.setOnLongClickListener(new View.OnLongClickListener() {
                          @Override
                          public boolean onLongClick(View v) { return openAppInfo(pkg); }
                      });
                      appsGrid.addView(item);
                  }
              }

              private TextView createButton(String text, String baseHex, String focusHex, boolean isHero) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(isHero ? 20 : 15);
                  tv.setTypeface(isHero ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                  tv.setGravity(Gravity.CENTER);
                  tv.setSingleLine(true);
                  tv.setFocusable(true);
                  tv.setFocusableInTouchMode(true);
                  tv.setPadding(24, isHero ? 42 : 28, 24, isHero ? 42 : 28);

                  final GradientDrawable normalBg = new GradientDrawable();
                  normalBg.setColor(Color.parseColor(baseHex));
                  normalBg.setCornerRadius(16f);
                  normalBg.setStroke(3, Color.parseColor("#30363D"));

                  final GradientDrawable focusedBg = new GradientDrawable();
                  focusedBg.setColor(Color.parseColor(baseHex));
                  focusedBg.setCornerRadius(16f);
                  focusedBg.setStroke(6, Color.parseColor(focusHex));

                  tv.setBackground(normalBg);
                  tv.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          v.setBackground(hasFocus ? focusedBg : normalBg);
                          v.setScaleX(hasFocus ? 1.05f : 1.0f);
                          v.setScaleY(hasFocus ? 1.05f : 1.0f);
                      }
                  });

                  if (isHero) {
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                      lp.setMargins(12, 0, 12, 0);
                      tv.setLayoutParams(lp);
                  } else {
                      GridLayout.LayoutParams glp = new GridLayout.LayoutParams();
                      glp.width = 0;
                      glp.columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f);
                      glp.setMargins(10, 10, 10, 10);
                      tv.setLayoutParams(glp);
                  }
                  return tv;
              }

              private void launchSpecialApp(String pkg, String name) {
                  if (pkg != null) {
                      launchPackage(pkg);
                  } else {
                      Toast.makeText(this, "Приложение " + name + " еще не установлено!", Toast.LENGTH_LONG).show();
                  }
              }

              private void launchPackage(String pkg) {
                  Intent intent = pm.getLeanbackLaunchIntentForPackage(pkg);
                  if (intent == null) intent = pm.getLaunchIntentForPackage(pkg);
                  if (intent != null) {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  }
              }

              private boolean openAppInfo(String pkg) {
                  if (pkg == null) return false;
                  Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  intent.setData(Uri.parse("package:" + pkg));
                  startActivity(intent);
                  return true;
              }
          }
          EOF

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)

          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM/android.jar" -classpath "$PLATFORM/android.jar" -d build/classes src/com/custom/philipslauncher/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output build/ build/classes/com/custom/philipslauncher/*.class
          "$BUILD_TOOLS/aapt" package -f -M AndroidManifest.xml -I "$PLATFORM/android.jar" -F build/unsigned.apk
          cd build && zip -uj unsigned.apk classes.dex && cd ..
          "$BUILD_TOOLS/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out launcher.apk build/aligned.apk

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: philips-launcher-apk
          path: launcher.apk
