name: Build Philips Glass UI v7

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Сборка APK с полупрозрачными блоками и исправленными кнопками
        run: |
          mkdir -p src/com/custom/philipslauncher res/xml build/classes

          cat << 'EOF' > res/xml/key_service.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents|flagIncludeNotImportantViews"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="30" />
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.custom.philipslauncher"
              android:versionCode="7"
              android:versionName="7.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="29" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <!-- android:debuggable="true" позволяет заливать фото напрямую во внутреннюю память лаунчера через run-as -->
              <application
                  android:label="Philips Glass Home"
                  android:debuggable="true"
                  android:hardwareAccelerated="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:launchMode="singleTask"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeyInterceptService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/key_service" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/custom/philipslauncher/KeyInterceptService.java
          package com.custom.philipslauncher;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.view.KeyEvent;
          import android.view.accessibility.AccessibilityEvent;
          import java.util.List;

          public class KeyInterceptService extends AccessibilityService {
              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              protected boolean onKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int scan = event.getScanCode();

                  // Кнопка Netflix на пультах Philips (все коды и скан-коды шасси TPM21.5E)
                  if (code == KeyEvent.KEYCODE_BUTTON_1 || code == KeyEvent.KEYCODE_BUTTON_8 || code == 188 || code == 191 || code == 195 || scan == 380 || scan == 412 || scan == 217 || scan == 139 || scan == 402) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          launchByKeyword("v2ray");
                      }
                      return true;
                  }

                  // Соседние рекламные кнопки (Prime Video / Rakuten / IVI) -> запуск Zona
                  if (code == KeyEvent.KEYCODE_BUTTON_2 || code == KeyEvent.KEYCODE_BUTTON_3 || code == KeyEvent.KEYCODE_BUTTON_4 || code == 189 || code == 190 || scan == 381 || scan == 413) {
                      if (event.getAction() == KeyEvent.ACTION_DOWN) {
                          launchByKeyword("zona");
                      }
                      return true;
                  }
                  return super.onKeyEvent(event);
              }

              private void launchByKeyword(String keyword) {
                  try {
                      PackageManager pm = getPackageManager();
                      Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                      List<ResolveInfo> list = pm.queryIntentActivities(mainIntent, 0);
                      for (ResolveInfo info : list) {
                          String pkg = info.activityInfo.packageName;
                          String label = info.loadLabel(pm).toString();
                          if (pkg.toLowerCase().contains(keyword) || label.toLowerCase().contains(keyword)) {
                              Intent launch = pm.getLeanbackLaunchIntentForPackage(pkg);
                              if (launch == null) launch = pm.getLaunchIntentForPackage(pkg);
                              if (launch == null) {
                                  launch = new Intent(Intent.ACTION_MAIN);
                                  launch.setClassName(pkg, info.activityInfo.name);
                              }
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                              startActivity(launch);
                              return;
                          }
                      }
                  } catch (Exception ignored) {}
              }
          }
          EOF

          cat << 'EOF' > src/com/custom/philipslauncher/MainActivity.java
          package com.custom.philipslauncher;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private PackageManager pm;
              private AppEntry v2rayApp = null;
              private AppEntry zonaApp = null;
              private LinearLayout appsStrip;
              private TextView topTimeView, topDateView;
              private ImageView bgWallpaper;

              private static class AppEntry {
                  String label;
                  String pkg;
                  String activityName;
                  Drawable icon;
                  Drawable banner;
                  boolean isPriority;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  pm = getPackageManager();
                  buildUi();
                  loadCustomWallpaper();
                  loadAppsRow();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateClock();
                  loadCustomWallpaper();
                  if (appsStrip.getChildCount() == 0) {
                      loadAppsRow();
                  }
              }

              @Override
              public void onBackPressed() {}

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  int scan = event.getScanCode();
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_1 || keyCode == 188 || keyCode == 191 || scan == 380 || scan == 412 || scan == 217) {
                      launchEntry(v2rayApp, "v2rayTun");
                      return true;
                  }
                  if (keyCode == KeyEvent.KEYCODE_BUTTON_2 || keyCode == KeyEvent.KEYCODE_BUTTON_3 || keyCode == 189 || keyCode == 190 || scan == 381 || scan == 413) {
                      launchEntry(zonaApp, "Zona");
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              // Загрузка фото из внутренней папки приложения (не блокируется защитой Android 11)
              private void loadCustomWallpaper() {
                  try {
                      File internalFile = new File(getFilesDir(), "wallpaper.jpg");
                      File extFile = new File(getExternalFilesDir(null), "wallpaper.jpg");
                      String[] paths = new String[] {
                          internalFile.getAbsolutePath(),
                          extFile.getAbsolutePath(),
                          "/data/local/tmp/wallpaper.jpg",
                          "/sdcard/wallpaper.jpg"
                      };
                      for (String path : paths) {
                          File f = new File(path);
                          if (f.exists() && f.length() > 100) {
                              BitmapFactory.Options opts = new BitmapFactory.Options();
                              opts.inPreferredConfig = Bitmap.Config.ARGB_8888;
                              Bitmap bmp = BitmapFactory.decodeFile(f.getAbsolutePath(), opts);
                              if (bmp != null) {
                                  bgWallpaper.setImageBitmap(bmp);
                                  return;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void buildUi() {
                  FrameLayout screen = new FrameLayout(this);
                  screen.setBackgroundColor(Color.parseColor("#12161F"));

                  // Полноэкранная фотография
                  bgWallpaper = new ImageView(this);
                  bgWallpaper.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  screen.addView(bgWallpaper, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  // Легкое затемнение только у самых краев, середина полностью прозрачна
                  View topBottomShade = new View(this);
                  GradientDrawable vignette = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.parseColor("#55000000"), Color.TRANSPARENT, Color.TRANSPARENT, Color.parseColor("#88000000")});
                  topBottomShade.setBackground(vignette);
                  screen.addView(topBottomShade, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(52, 32, 52, 28);
                  root.setClipChildren(false);
                  root.setClipToPadding(false);

                  // Верхняя панель с полупрозрачными кнопками
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);

                  topBar.addView(createTopPill("🛡  v2rayTun VPN", new View.OnClickListener() {
                      @Override public void onClick(View v) { launchEntry(v2rayApp, "v2rayTun"); }
                  }));
                  topBar.addView(createTopPill("🎬  Zona Кино", new View.OnClickListener() {
                      @Override public void onClick(View v) { launchEntry(zonaApp, "Zona"); }
                  }));
                  topBar.addView(createTopPill("⚙  Настройки ТВ", new View.OnClickListener() {
                      @Override public void onClick(View v) { startActivity(new Intent(Settings.ACTION_SETTINGS)); }
                  }));
                  topBar.addView(createTopPill("🌐  Сеть", new View.OnClickListener() {
                      @Override public void onClick(View v) { startActivity(new Intent(Settings.ACTION_WIFI_SETTINGS)); }
                  }));

                  View hSpacer = new View(this);
                  topBar.addView(hSpacer, new LinearLayout.LayoutParams(0, 1, 1f));

                  LinearLayout clockPill = new LinearLayout(this);
                  clockPill.setOrientation(LinearLayout.HORIZONTAL);
                  clockPill.setGravity(Gravity.CENTER_VERTICAL);
                  clockPill.setPadding(24, 8, 24, 8);
                  GradientDrawable clockBg = new GradientDrawable();
                  clockBg.setColor(Color.parseColor("#550F172A"));
                  clockBg.setCornerRadius(30f);
                  clockBg.setStroke(2, Color.parseColor("#55FFFFFF"));
                  clockPill.setBackground(clockBg);

                  topTimeView = new TextView(this);
                  topTimeView.setTextColor(Color.WHITE);
                  topTimeView.setTextSize(19);
                  topTimeView.setTypeface(Typeface.DEFAULT_BOLD);
                  clockPill.addView(topTimeView);

                  topDateView = new TextView(this);
                  topDateView.setTextColor(Color.parseColor("#E2E8F0"));
                  topDateView.setTextSize(13);
                  topDateView.setPadding(12, 0, 0, 0);
                  clockPill.addView(topDateView);

                  topBar.addView(clockPill);
                  root.addView(topBar);

                  // Свободный центр экрана для фотографии
                  View photoWindow = new View(this);
                  photoWindow.setFocusable(false);
                  root.addView(photoWindow, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  // Нижний ряд полупрозрачных карточек
                  HorizontalScrollView appScroll = new HorizontalScrollView(this);
                  appScroll.setHorizontalScrollBarEnabled(false);
                  appScroll.setFocusable(false);
                  appScroll.setClipChildren(false);
                  appScroll.setClipToPadding(false);

                  appsStrip = new LinearLayout(this);
                  appsStrip.setOrientation(LinearLayout.HORIZONTAL);
                  appsStrip.setPadding(14, 16, 14, 12);
                  appsStrip.setClipChildren(false);
                  appsStrip.setClipToPadding(false);
                  appScroll.addView(appsStrip);

                  root.addView(appScroll);
                  screen.addView(root, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  setContentView(screen);
              }

              private void updateClock() {
                  Date now = new Date();
                  topTimeView.setText(new SimpleDateFormat("HH:mm", Locale.getDefault()).format(now));
                  topDateView.setText(new SimpleDateFormat("EEE, d MMM", Locale.getDefault()).format(now));
              }

              private void loadAppsRow() {
                  appsStrip.removeAllViews();
                  v2rayApp = null;
                  zonaApp = null;

                  Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                  List<ResolveInfo> resolved = pm.queryIntentActivities(mainIntent, 0);
                  List<AppEntry> list = new ArrayList<AppEntry>();
                  Set<String> seenPackages = new HashSet<String>();

                  for (ResolveInfo info : resolved) {
                      if (info.activityInfo == null) continue;
                      String pkg = info.activityInfo.packageName;
                      if (pkg.equals(getPackageName()) || seenPackages.contains(pkg)) continue;

                      Intent lb = pm.getLeanbackLaunchIntentForPackage(pkg);
                      Intent std = pm.getLaunchIntentForPackage(pkg);
                      if (lb == null && std == null) continue;

                      seenPackages.add(pkg);

                      AppEntry entry = new AppEntry();
                      entry.pkg = pkg;
                      entry.activityName = info.activityInfo.name;
                      entry.label = info.loadLabel(pm).toString();
                      entry.icon = info.loadIcon(pm);
                      entry.banner = info.activityInfo.loadBanner(pm);
                      if (entry.banner == null) {
                          entry.banner = info.activityInfo.applicationInfo.loadBanner(pm);
                      }

                      String lp = pkg.toLowerCase();
                      String ll = entry.label.toLowerCase();
                      if (lp.contains("v2ray") || ll.contains("v2ray")) {
                          v2rayApp = entry;
                          entry.isPriority = true;
                      } else if (lp.contains("zona") || ll.equals("zona")) {
                          zonaApp = entry;
                          entry.isPriority = true;
                      }
                      list.add(entry);
                  }

                  Collections.sort(list, new Comparator<AppEntry>() {
                      @Override
                      public int compare(AppEntry a, AppEntry b) {
                          if (a.isPriority != b.isPriority) return a.isPriority ? -1 : 1;
                          return a.label.compareToIgnoreCase(b.label);
                      }
                  });

                  View firstCard = null;
                  for (final AppEntry app : list) {
                      View card = createGlassAppCard(app);
                      appsStrip.addView(card);
                      if (firstCard == null) firstCard = card;
                  }
                  if (firstCard != null) firstCard.requestFocus();
              }

              // ПОЛУПРОЗРАЧНАЯ СТЕКЛЯННАЯ КАРТОЧКА ПРИЛОЖЕНИЯ (Сквозь неё видно фоновое фото!)
              private View createGlassAppCard(final AppEntry app) {
                  LinearLayout wrapper = new LinearLayout(this);
                  wrapper.setOrientation(LinearLayout.VERTICAL);
                  wrapper.setGravity(Gravity.CENTER_HORIZONTAL);
                  wrapper.setFocusable(true);
                  wrapper.setClickable(true);
                  wrapper.setDescendantFocusability(LinearLayout.FOCUS_BLOCK_DESCENDANTS);

                  LinearLayout.LayoutParams wrapLp = new LinearLayout.LayoutParams(232, LinearLayout.LayoutParams.WRAP_CONTENT);
                  wrapLp.setMargins(10, 0, 10, 0);
                  wrapper.setLayoutParams(wrapLp);

                  final FrameLayout cardBox = new FrameLayout(this);
                  LinearLayout.LayoutParams boxLp = new LinearLayout.LayoutParams(220, 118);
                  cardBox.setLayoutParams(boxLp);

                  // Полупрозрачный фон (55% прозрачности в покое, 75% при наведении + золотая рамка)
                  final GradientDrawable normalBoxBg = new GradientDrawable();
                  normalBoxBg.setColor(Color.parseColor("#660F172A"));
                  normalBoxBg.setCornerRadius(14f);
                  normalBoxBg.setStroke(2, Color.parseColor("#55FFFFFF"));

                  final GradientDrawable focusedBoxBg = new GradientDrawable();
                  focusedBoxBg.setColor(Color.parseColor("#991E293B"));
                  focusedBoxBg.setCornerRadius(14f);
                  focusedBoxBg.setStroke(5, Color.parseColor("#FFD600"));

                  cardBox.setBackground(normalBoxBg);

                  LinearLayout inner = new LinearLayout(this);
                  inner.setOrientation(LinearLayout.HORIZONTAL);
                  inner.setGravity(Gravity.CENTER);
                  inner.setPadding(16, 12, 16, 12);

                  ImageView iconImg = new ImageView(this);
                  iconImg.setImageDrawable(app.icon != null ? app.icon : app.banner);
                  iconImg.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  inner.addView(iconImg, new LinearLayout.LayoutParams(58, 58));

                  TextView innerTitle = new TextView(this);
                  innerTitle.setText(app.label);
                  innerTitle.setTextColor(Color.WHITE);
                  innerTitle.setShadowLayer(4f, 0f, 2f, Color.BLACK);
                  innerTitle.setTextSize(15);
                  innerTitle.setTypeface(Typeface.DEFAULT_BOLD);
                  innerTitle.setMaxLines(2);
                  innerTitle.setEllipsize(TextUtils.TruncateAt.END);
                  innerTitle.setPadding(12, 0, 0, 0);
                  inner.addView(innerTitle, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  cardBox.addView(inner, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  final TextView bottomCaption = new TextView(this);
                  bottomCaption.setText(app.label);
                  bottomCaption.setTextColor(Color.WHITE);
                  bottomCaption.setShadowLayer(6f, 0f, 2f, Color.BLACK);
                  bottomCaption.setTextSize(13);
                  bottomCaption.setSingleLine(true);
                  bottomCaption.setEllipsize(TextUtils.TruncateAt.END);
                  bottomCaption.setGravity(Gravity.CENTER);
                  bottomCaption.setPadding(4, 6, 4, 2);

                  wrapper.addView(cardBox);
                  wrapper.addView(bottomCaption);

                  wrapper.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          cardBox.setBackground(hasFocus ? focusedBoxBg : normalBoxBg);
                          bottomCaption.setTextColor(hasFocus ? Color.parseColor("#FFD600") : Color.WHITE);
                          bottomCaption.setTypeface(hasFocus ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                          v.animate().scaleX(hasFocus ? 1.10f : 1.0f).scaleY(hasFocus ? 1.10f : 1.0f).setDuration(120).start();
                      }
                  });

                  // Стандартный системный обработчик клика + дублирующий перехват пульта
                  wrapper.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          launchEntry(app, app.label);
                      }
                  });

                  wrapper.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override
                      public boolean onLongClick(View v) {
                          openAppInfo(app.pkg);
                          return true;
                      }
                  });

                  wrapper.setOnKeyListener(new View.OnKeyListener() {
                      @Override
                      public boolean onKey(View v, int keyCode, KeyEvent event) {
                          if (keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER || keyCode == KeyEvent.KEYCODE_NUMPAD_ENTER || keyCode == KeyEvent.KEYCODE_BUTTON_SELECT || keyCode == KeyEvent.KEYCODE_BUTTON_A) {
                              if (event.getAction() == KeyEvent.ACTION_UP) {
                                  launchEntry(app, app.label);
                                  return true;
                              }
                          }
                          return false;
                      }
                  });

                  return wrapper;
              }

              private View createTopPill(String text, final View.OnClickListener listener) {
                  TextView pill = new TextView(this);
                  pill.setText(text);
                  pill.setTextColor(Color.WHITE);
                  pill.setTextSize(13);
                  pill.setTypeface(Typeface.DEFAULT_BOLD);
                  pill.setPadding(22, 10, 22, 10);
                  pill.setFocusable(true);
                  pill.setClickable(true);

                  final GradientDrawable normal = new GradientDrawable();
                  normal.setColor(Color.parseColor("#550F172A"));
                  normal.setCornerRadius(24f);
                  normal.setStroke(2, Color.parseColor("#55FFFFFF"));

                  final GradientDrawable focused = new GradientDrawable();
                  focused.setColor(Color.parseColor("#FFD600"));
                  focused.setCornerRadius(24f);

                  pill.setBackground(normal);
                  pill.setOnFocusChangeListener(new View.OnFocusChangeListener() {
                      @Override
                      public void onFocusChange(View v, boolean hasFocus) {
                          v.setBackground(hasFocus ? focused : normal);
                          pill.setTextColor(hasFocus ? Color.BLACK : Color.WHITE);
                      }
                  });
                  pill.setOnClickListener(listener);
                  pill.setOnKeyListener(new View.OnKeyListener() {
                      @Override
                      public boolean onKey(View v, int keyCode, KeyEvent event) {
                          if ((keyCode == KeyEvent.KEYCODE_DPAD_CENTER || keyCode == KeyEvent.KEYCODE_ENTER) && event.getAction() == KeyEvent.ACTION_UP) {
                              listener.onClick(v);
                              return true;
                          }
                          return false;
                      }
                  });

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 0, 14, 0);
                  pill.setLayoutParams(lp);
                  return pill;
              }

              private void launchEntry(AppEntry app, String fallbackName) {
                  if (app == null) {
                      Toast.makeText(this, "Приложение " + fallbackName + " не найдено!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      Intent intent = pm.getLeanbackLaunchIntentForPackage(app.pkg);
                      if (intent == null) intent = pm.getLaunchIntentForPackage(app.pkg);
                      if (intent == null && app.activityName != null) {
                          intent = new Intent(Intent.ACTION_MAIN);
                          intent.setComponent(new ComponentName(app.pkg, app.activityName));
                      }
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                          startActivity(intent);
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Ошибка запуска: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }

              private void openAppInfo(String pkg) {
                  if (pkg == null) return;
                  Intent intent = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                  intent.setData(Uri.parse("package:" + pkg));
                  startActivity(intent);
              }
          }
          EOF

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)

          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM/android.jar" -classpath "$PLATFORM/android.jar" -d build/classes src/com/custom/philipslauncher/*.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" --output build/ build/classes/com/custom/philipslauncher/*.class
          "$BUILD_TOOLS/aapt" package -f -M AndroidManifest.xml -S res -I "$PLATFORM/android.jar" -F build/unsigned.apk
          cd build && zip -uj unsigned.apk classes.dex && cd ..
          "$BUILD_TOOLS/zipalign" -f 4 build/unsigned.apk build/aligned.apk

          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out launcher.apk build/aligned.apk

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: philips-glass-ui-v7
          path: launcher.apk
