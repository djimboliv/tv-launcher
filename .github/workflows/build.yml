          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;

          public class MainActivity extends Activity {
              private PackageManager pm;
              private SharedPreferences prefs;
              private List<AppEntry> allApps = new ArrayList<AppEntry>();
              private AppEntry v2rayApp = null;
              private AppEntry zonaApp = null;
              private LinearLayout appsStrip;
              private FrameLayout allAppsOverlay;
              private GridLayout allAppsGrid;
              private TextView topTimeView, topDateView;
              private ImageView bgWallpaper;
              private AlertDialog waitingKeyDialog = null;
              private long lastLongPressTime = 0;
              private boolean wallpaperLoaded = false;

              private static class AppEntry {
                  String label;
                  String pkg;
                  String activityName;
                  Drawable icon;
                  Drawable banner;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  pm = getPackageManager();
                  prefs = getSharedPreferences("launcher_prefs", MODE_PRIVATE);
                  buildUi();
                  loadCustomWallpaper();
                  scanInstalledApps();
                  renderFavoritesStrip();
                  checkIncomingKeyBind(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  checkIncomingKeyBind(intent);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateClock();
                  if (!wallpaperLoaded) loadCustomWallpaper();
                  scanInstalledApps();
                  renderFavoritesStrip();
                  checkIncomingKeyBind(getIntent());
              }

              private void checkIncomingKeyBind(Intent intent) {
                  if (intent == null) return;
                  final String keyId = intent.getStringExtra("bind_key_id");
                  final String keyLabel = intent.getStringExtra("bind_key_label");
                  if (keyId != null && !keyId.isEmpty()) {
                      intent.removeExtra("bind_key_id");
                      intent.removeExtra("bind_key_label");
                      if (waitingKeyDialog != null && waitingKeyDialog.isShowing()) {
                          try { waitingKeyDialog.dismiss(); } catch (Exception ignored) {}
                      }
                      showAppPickerForBoundKey(keyId, keyLabel);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (allAppsOverlay != null && allAppsOverlay.getVisibility() == View.VISIBLE) {
                      allAppsOverlay.setVisibility(View.GONE);
                      if (appsStrip.getChildCount() > 0) {
                          appsStrip.getChildAt(0).requestFocus();
                      }
                  }
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  int code = event.getKeyCode();
                  int scan = event.getScanCode();

                  if (KeyInterceptService.waitingForKey) {
                      if (code == KeyEvent.KEYCODE_BACK) {
                          if (event.getAction() == KeyEvent.ACTION_UP) {
                              KeyInterceptService.waitingForKey = false;
                              if (waitingKeyDialog != null && waitingKeyDialog.isShowing()) {
                                  waitingKeyDialog.dismiss();
                              }
                          }
                          return true;
                      }
                      if (!KeyInterceptService.isSystemNavKey(code) && (code != 0 || scan != 0)) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN) {
                              KeyInterceptService.waitingForKey = false;
                              if (waitingKeyDialog != null && waitingKeyDialog.isShowing()) {
                                  waitingKeyDialog.dismiss();
                              }
                              String keyId = code + ":" + scan;
                              showAppPickerForBoundKey(keyId, "Код " + code + " / Скан " + scan);
                          }
                          return true;
                      }
                  }

                  if (code != 0 || scan != 0) {
                      String keyId = code + ":" + scan;
                      String targetPkg = prefs.getString("bind_" + keyId, null);
                      if (targetPkg != null && !targetPkg.isEmpty()) {
                          if (event.getAction() == KeyEvent.ACTION_DOWN && event.getRepeatCount() == 0) {
                              launchByPkg(targetPkg);
                          }
                          return true;
                      }
                  }

                  return super.dispatchKeyEvent(event);
              }

              private void startUniversalKeyBind() {
                  String[] menuItems = new String[] {
                      "🎯 Нажать кнопку на пульте и выбрать приложение",
                      "📺 Переназначить кнопку IVI (перехват системного запуска IVI)",
                      "🗑 Сбросить все привязанные кнопки пульта"
                  };

                  AlertDialog.Builder menu = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                  menu.setTitle("Управление кнопками пульта (v11)");
                  menu.setItems(menuItems, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface dialog, int which) {
                          if (which == 0) {
                              showWaitingForKeyDialog();
                          } else if (which == 1) {
                              showAppPickerForBoundKey("pkg:ru.ivi.client", "Кнопка IVI");
                          } else if (which == 2) {
                              clearAllBoundKeys();
                          }
                      }
                  });
                  menu.show();
              }

              private void showWaitingForKeyDialog() {
                  KeyInterceptService.waitingForKey = true;
                  AlertDialog.Builder b = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                  b.setTitle("Нажмите кнопку на пульте");
                  b.setMessage("Нажмите любую кнопку, которую хотите перепривязать (например, IVI, Netflix, Rakuten или цветную кнопку).\n\nДля отмены нажмите кнопку «Назад».");
                  b.setOnCancelListener(new DialogInterface.OnCancelListener() {
                      @Override
                      public void onCancel(DialogInterface dialog) {
                          KeyInterceptService.waitingForKey = false;
                      }
                  });
                  waitingKeyDialog = b.create();
                  waitingKeyDialog.setOnKeyListener(new DialogInterface.OnKeyListener() {
                      @Override
                      public boolean onKey(DialogInterface d, int keyCode, KeyEvent event) {
                          int scan = event.getScanCode();
                          if (keyCode == KeyEvent.KEYCODE_BACK) {
                              KeyInterceptService.waitingForKey = false;
                              d.dismiss();
                              return true;
                          }
                          if (!KeyInterceptService.isSystemNavKey(keyCode) && (keyCode != 0 || scan != 0)) {
                              if (event.getAction() == KeyEvent.ACTION_DOWN) {
                                  KeyInterceptService.waitingForKey = false;
                                  d.dismiss();
                                  showAppPickerForBoundKey(keyCode + ":" + scan, "Код " + keyCode + " / Скан " + scan);
                              }
                              return true;
                          }
                          return false;
                      }
                  });
                  waitingKeyDialog.show();
              }

              private void showAppPickerForBoundKey(final String keyId, final String keyLabel) {
                  scanInstalledApps();
                  final String[] appNames = new String[allApps.size() + 1];
                  appNames[0] = "❌ Отключить привязку для этой кнопки";
                  for (int i = 0; i < allApps.size(); i++) {
                      appNames[i + 1] = allApps.get(i).label;
                  }

                  AlertDialog.Builder picker = new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert);
                  picker.setTitle("Выберите приложение для кнопки (" + keyLabel + "):");
                  picker.setItems(appNames, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface dialog, int which) {
                          if (which == 0) {
                              prefs.edit().remove("bind_" + keyId).apply();
                              Toast.makeText(MainActivity.this, "Привязка кнопки удалена", Toast.LENGTH_SHORT).show();
                          } else {
                              AppEntry chosen = allApps.get(which - 1);
                              prefs.edit().putString("bind_" + keyId, chosen.pkg).apply();
                              Toast.makeText(MainActivity.this, "Готово! Кнопка теперь открывает «" + chosen.label + "»", Toast.LENGTH_LONG).show();
                          }
                      }
                  });
                  picker.show();
              }

              private void clearAllBoundKeys() {
                  SharedPreferences.Editor ed = prefs.edit();
                  Map<String, ?> all = prefs.getAll();
                  for (String k : all.keySet()) {
                      if (k.startsWith("bind_") || k.startsWith("vpn_") || k.startsWith("zona_")) {
                          ed.remove(k);
                      }
                  }
                  ed.apply();
                  Toast.makeText(this, "Все привязки кнопок сброшены!", Toast.LENGTH_SHORT).show();
              }

              private void loadCustomWallpaper() {
                  try {
                      File internalFile = new File(getFilesDir(), "wallpaper.jpg");
                      File extFile = new File(getExternalFilesDir(null), "wallpaper.jpg");
                      String[] paths = new String[] {
                          internalFile.getAbsolutePath(),
                          extFile.getAbsolutePath(),
                          "/data/local/tmp/wallpaper.jpg",
                          "/sdcard/wallpaper.jpg"
                      };
                      for (String path : paths) {
                          File f = new File(path);
                          if (f.exists() && f.length() > 100) {
                              BitmapFactory.Options opts = new BitmapFactory.Options();
                              opts.inJustDecodeBounds = true;
                              BitmapFactory.decodeFile(f.getAbsolutePath(), opts);
                              int sample = 1;
                              while ((opts.outWidth / sample) > 1920 || (opts.outHeight / sample) > 1080) {
                                  sample *= 2;
                              }
                              opts.inJustDecodeBounds = false;
                              opts.inSampleSize = sample;
                              Bitmap bmp = BitmapFactory.decodeFile(f.getAbsolutePath(), opts);
                              if (bmp != null) {
                                  bgWallpaper.setImageBitmap(bmp);
                                  wallpaperLoaded = true;
                                  return;
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

